<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<title>局域网文件与文本分享</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --border: #e2e5ea;
    --text: #1f2328;
    --text-dim: #6b7280;
    --accent: #2f6feb;
    --accent-text: #ffffff;
    --code-bg: #f6f8fa;
    --code-border: #e2e5ea;
    --ok: #1a7f37;
    --err: #cf222e;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1c2129;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #9198a1;
      --accent: #4c8dff;
      --accent-text: #0d1117;
      --code-bg: #0b0f14;
      --code-border: #30363d;
      --ok: #3fb950;
      --err: #f85149;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .layout { flex: 1 0 auto; }

  header {
    padding: 20px 24px 12px;
    max-width: 1200px;
    margin: 0 auto;
    text-align: center;
  }
  header h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  header .app-version {
    margin: 0;
    color: var(--text-dim);
    font-size: 13px;
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
  }
  header .app-version a.update-hint {
    color: var(--ok);
    text-decoration: none;
    font-weight: 600;
  }
  header .app-version a.update-hint:hover {
    text-decoration: underline;
  }

  .layout {
    max-width: 1200px;
    margin: 0 auto;
    padding: 8px 24px 40px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 900px) {
    .layout { grid-template-columns: minmax(300px, 1fr) minmax(340px, 1.3fr); align-items: start; }
  }

  .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card > h2 {
    font-size: 14px;
    font-weight: 700;
    margin: 0;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card > h2 .count {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 9px;
  }
  .card-body { padding: 14px 18px; }

  /* 状态提示 */
  .status { color: var(--text-dim); font-size: 14px; padding: 6px 2px; }
  .status.error { color: var(--err); }

  /* 文件列表 */
  ul.file-list { list-style: none; margin: 0; padding: 0; }
  ul.file-list li { border-bottom: 1px solid var(--border); }
  ul.file-list li:last-child { border-bottom: none; }
  ul.file-list .ico { flex: none; opacity: .7; }

  .file-groups { display: flex; flex-direction: column; gap: 16px; }
  .file-group-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 2px;
    padding: 0 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .file-group-title .count {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 7px;
  }
  .file-row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 2px;
  }
  ul.file-list .file-main {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1 1 auto;
    min-width: 0;
    padding: 3px 4px;
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    word-break: break-all;
    cursor: pointer;
  }
  ul.file-list .file-main:hover { color: var(--accent); background: rgba(127, 127, 127, 0.08); }
  ul.file-list .file-main .fname { min-width: 0; }
  ul.file-list .file-thumb {
    flex: none;
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  ul.file-list .file-action {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    margin: 0;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  ul.file-list .file-action svg { width: 17px; height: 17px; }
  ul.file-list .file-action:hover {
    color: var(--accent);
    background: rgba(127, 127, 127, 0.14);
  }
  ul.file-list .file-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 相册网格（图片 / 视频） */
  .media-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    gap: 3px;
  }
  .media-tile {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 6px;
    background: #1a1d21;
  }
  .media-tile__hit {
    display: block;
    width: 100%;
    height: 100%;
    color: inherit;
    text-decoration: none;
  }
  .media-tile .media-thumb {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #1a1d21;
  }
  .media-tile .media-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    color: #c8cdd3;
  }
  .media-tile .media-fallback svg { width: 28px; height: 28px; opacity: .7; }
  .media-badge {
    position: absolute;
    left: 6px;
    bottom: 6px;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,.48);
    color: #fff;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  .media-badge svg { width: 12px; height: 12px; margin-left: 1px; }
  .media-tile.is-playing .media-badge { opacity: 0; }
  .media-name {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
    padding: 22px 8px 6px;
    font-size: 11px;
    line-height: 1.3;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    background: linear-gradient(transparent, rgba(0,0,0,.55));
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .media-dl {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(0,0,0,.45);
    color: #fff;
    text-decoration: none;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s;
  }
  .media-dl svg { width: 15px; height: 15px; }
  .media-dl:hover { background: rgba(0,0,0,.7); }
  .media-tile:hover .media-name,
  .media-tile:hover .media-dl,
  .media-tile:focus-within .media-name,
  .media-tile:focus-within .media-dl { opacity: 1; }
  .media-hover {
    position: fixed;
    z-index: 950;
    display: flex;
    flex-direction: column;
    max-width: min(480px, 72vw);
    max-height: min(72vh, 640px);
    background: #111318;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0,0,0,.38);
    overflow: hidden;
    pointer-events: none;
  }
  .media-hover[hidden] { display: none; }
  .media-hover img {
    display: block;
    max-width: min(480px, 72vw);
    max-height: min(64vh, 580px);
    object-fit: contain;
    background: #111318;
  }
  .media-hover-caption {
    flex: none;
    padding: 8px 12px;
    font-size: 12px;
    color: #e6edf3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 文件预览浮层 */
  .preview-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 18, 22, 0.58);
  }
  .preview-overlay[hidden] { display: none; }
  .preview-dialog {
    display: flex;
    flex-direction: column;
    min-width: min(280px, 92vw);
    max-width: min(960px, 100%);
    max-height: 92vh;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 16px 48px rgba(0,0,0,.28);
    overflow: hidden;
  }
  .preview-dialog:not(.is-media) { width: min(640px, 92vw); }
  .preview-dialog.is-media { background: #111318; border-color: #2a2f36; }
  .preview-dialog.is-media .preview-title { color: #e6edf3; }
  .preview-dialog.is-media .preview-icon-btn { color: #9aa3ad; }
  .preview-dialog.is-media .preview-icon-btn:hover { color: #e6edf3; background: rgba(255,255,255,.1); }
  .preview-header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: none;
    padding: 10px 12px 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .preview-dialog.is-media .preview-header { border-bottom-color: #2a2f36; }
  .preview-title {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .preview-actions { display: flex; align-items: center; gap: 2px; flex: none; }
  .preview-icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  .preview-icon-btn:hover { background: rgba(127, 127, 127, 0.14); color: var(--text); }
  .preview-icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .preview-icon-btn svg { width: 18px; height: 18px; }
  .preview-body {
    overflow: auto;
    min-width: min(280px, 80vw);
  }
  .preview-body img {
    display: block;
    max-width: min(920px, 92vw);
    max-height: calc(92vh - 58px);
    object-fit: contain;
    margin: 0 auto;
    background:
      linear-gradient(45deg, #c8ccd2 25%, transparent 25%),
      linear-gradient(-45deg, #c8ccd2 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #c8ccd2 75%),
      linear-gradient(-45deg, transparent 75%, #c8ccd2 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    background-color: #e8eaed;
  }
  .preview-body video,
  .preview-body audio {
    display: block;
    width: min(920px, 92vw);
  }
  .preview-body video { max-height: calc(92vh - 58px); background: #000; }
  .preview-body audio { padding: 28px 20px; }
  .preview-body iframe {
    display: block;
    width: min(920px, 92vw);
    height: min(80vh, 860px);
    border: 0;
    background: var(--panel-2);
  }
  .preview-body pre {
    margin: 0;
    padding: 14px 16px;
    max-width: min(920px, 92vw);
    max-height: calc(92vh - 58px);
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }
  .preview-hint {
    margin: 0;
    padding: 28px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* 文本条目通用（参考 nginx 原页风格）*/
  .item { margin-top: 0.55rem; }
  .item:first-child { margin-top: 0.35rem; }
  .item .item-title {
    margin: 0.05rem 0 0.1rem;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text);
    word-break: break-all;
  }

  /* 单行文本（lines）：圆角浅色框 + 框内透明圆形复制按钮，内容自动换行不出横向滚动条 */
  .copy-snippet {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
    padding: 0.65rem 0.75rem 0.65rem 1rem;
    border: 1px solid var(--code-border);
    border-radius: 9999px;
    background: var(--code-bg);
    min-width: 0;
    max-width: 100%;
  }
  .copy-snippet__text {
    flex: 1 1 0;
    width: 0;
    min-width: 0;
    margin: 0;
    padding: 0.15rem 0;
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
    font-size: 0.85rem;
    line-height: 1.45;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 长文本（texts）：圆角框 + 右上角透明复制按钮 */
  .copy-multiline {
    position: relative;
    display: flex;
    flex-direction: column;
    margin-top: 0.5rem;
    padding: 0.62rem 0.7rem;
    border: 1px solid var(--code-border);
    border-radius: 14px;
    background: var(--code-bg);
  }
  .copy-multiline__text {
    margin: 0;
    padding-right: 2.35rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    color: var(--text);
  }

  /* 透明圆形复制按钮 */
  .copy-btn {
    flex-shrink: 0;
    align-self: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    height: 2.25rem;
    margin: -0.15rem -0.25rem -0.15rem 0;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .copy-btn:hover {
    background: rgba(127, 127, 127, 0.14);
    color: var(--text);
  }
  .copy-btn:active { background: rgba(127, 127, 127, 0.22); }
  .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy-btn.copied { color: var(--ok); }
  .copy-btn svg { width: 18px; height: 18px; }
  .copy-multiline__btn { position: absolute; top: 0.22rem; right: 0.22rem; align-self: auto; margin: 0; }

  .copy-feedback {
    margin: 0.12rem 0 0 0.2rem;
    font-size: 0.75rem;
    min-height: 0.85em;
    color: var(--ok);
  }
  .copy-feedback.err { color: var(--err); }

  /* 粘贴录入 */
  .paste-form { display: flex; flex-direction: column; gap: 10px; }
  .paste-form label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .paste-form input[type="text"],
  .paste-form textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--code-bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .paste-form input[type="text"]:focus,
  .paste-form textarea:focus {
    border-color: var(--accent);
  }
  .paste-form textarea {
    min-height: 96px;
    resize: vertical;
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  .paste-title-row { display: none; }
  .paste-title-row.is-open { display: block; }
  .paste-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .paste-actions button {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .paste-actions .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  .paste-actions .btn-primary:hover { filter: brightness(1.08); }
  .paste-actions .btn-primary:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    filter: none;
  }
  .paste-actions .btn-secondary {
    background: var(--panel-2);
    color: var(--text);
  }
  .paste-actions .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .paste-msg {
    font-size: 12px;
    min-height: 1.2em;
    color: var(--text-dim);
  }
  .paste-msg.ok { color: var(--ok); }
  .paste-msg.err { color: var(--err); }

  footer {
    margin-top: auto;
    width: 100%;
    padding: 20px 24px 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
  }
  footer a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  footer a:hover {
    color: var(--accent);
  }
  /* ============ 手机 / 窄屏适配 ============
     放在所有基础样式之后，确保能正确覆盖桌面端卡片样式。
     去掉卡片背景/边框/阴影/内边距，仅靠字体与排版分区。 */
  @media (max-width: 640px) {
    header { padding: 16px 16px 4px; }
    header h1 { font-size: 18px; }
    header .app-version { font-size: 12px; overflow-wrap: anywhere; word-break: break-word; }

    .layout { padding: 4px 16px 8px; gap: 0; }
    .col { gap: 0; }

    /* 卡片扁平化：无背景、无边框、无阴影、无圆角 */
    .card {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      overflow: visible;
      margin-top: 22px;
    }
    .col > .card:first-child { margin-top: 6px; }

    /* 区块标题：去掉分隔线与内边距，用字号/字重区分 */
    .card > h2 {
      padding: 0 0 8px;
      border-bottom: none;
      font-size: 15px;
    }
    /* 内容区去掉左右内边距，靠页面级留白对齐 */
    .card-body { padding: 0; }

    ul.file-list .file-row { padding: 8px 0; }
    ul.file-list .file-main { padding: 4px 0; font-size: 15px; }
    .file-groups { gap: 20px; }
    .media-grid {
      margin: 0 -16px;
      gap: 2px;
    }
    .media-tile { border-radius: 0; }
    .media-dl { opacity: 0.92; }
    .preview-overlay { padding: 0; }
    .preview-dialog,
    .preview-dialog:not(.is-media) {
      width: 100%;
      max-width: 100%;
      max-height: 100vh;
      border-radius: 0;
      border: none;
    }
    .preview-body img,
    .preview-body video,
    .preview-body iframe,
    .preview-body pre { max-width: 100vw; }
    .preview-body iframe { height: calc(100vh - 54px); }
    .copy-snippet__text, .copy-multiline__text { font-size: 0.9rem; }

    footer { padding: 20px 16px 20px; margin-top: 12px; }
  }
</style>
</head>
<body>
  <header>
    <h1>局域网文件与文本分享</h1>
    <div id="app-version" class="app-version"></div>
  </header>

  <div class="layout">
    <!-- 左栏：文件列表 -->
    <div class="col">
      <section class="card">
        <h2>文件下载 <span class="count" id="files-count"></span></h2>
        <div class="card-body">
          <div id="files-status" class="status">正在加载…</div>
          <div class="file-groups" id="files-list"></div>
        </div>
      </section>
    </div>

    <!-- 右栏：单行文本 + 长文本 + 粘贴录入 -->
    <div class="col">
      <section class="card">

              <label for="paste-text">内容</label>

  <div id="media-hover" class="media-hover" hidden>
    <img id="media-hover-img" alt="" />

  <div id="preview-overlay" class="preview-overlay" hidden>
    <div class="preview-dialog" id="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="preview-title">

        <div class="preview-title" id="preview-title"></div>

          <a id="preview-download" class="preview-icon-btn" title="下载" aria-label="下载" download></a>

  </footer>

<script>
(function () {
  "use strict";

  var COPY_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
  var CHECK_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  var FILE_ICON =
    '<svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
  var IMAGE_ICON =
    '<svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
  var VIDEO_ICON =
    '<svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 9l6 3-6 3z"/></svg>';
  var AUDIO_ICON =
    '<svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
  var DOC_ICON =
    '<svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8M8 9h2"/></svg>';
  var TEXT_ICON =
    '<svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>';
  var ARCHIVE_ICON =
    '<svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>';
  var DOWNLOAD_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
  var EYE_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  var CLOSE_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  var PLAY_ICON =
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

  var FILE_CATEGORIES = [
    { id: "image", label: "图片", icon: IMAGE_ICON, exts: ["jpg", "jpeg", "png", "gif", "webp", "svg", "bmp", "ico", "avif", "heic", "heif", "tif", "tiff"] },
    { id: "video", label: "视频", icon: VIDEO_ICON, exts: ["mp4", "webm", "ogv", "mov", "mkv", "avi", "m4v", "wmv", "flv"] },
    { id: "audio", label: "音频", icon: AUDIO_ICON, exts: ["mp3", "wav", "ogg", "oga", "m4a", "flac", "aac", "opus", "wma"] },
    { id: "doc", label: "文档", icon: DOC_ICON, exts: ["pdf", "doc", "docx", "xls", "xlsx", "ppt", "pptx", "odt", "ods", "odp", "rtf"] },
    { id: "text", label: "文本", icon: TEXT_ICON, exts: ["txt", "md", "markdown", "json", "xml", "csv", "log", "yml", "yaml", "ini", "conf", "html", "htm", "css", "js", "ts", "go", "py", "java", "c", "h", "cpp", "rs", "sh", "bat", "ps1"] },
    { id: "archive", label: "压缩包", icon: ARCHIVE_ICON, exts: ["zip", "rar", "7z", "tar", "gz", "tgz", "bz2", "xz"] },
    { id: "other", label: "其他", icon: FILE_ICON, exts: null }
  ];
  var PREVIEW_EXTS = {
    image: { jpg: 1, jpeg: 1, png: 1, gif: 1, webp: 1, svg: 1, bmp: 1, ico: 1, avif: 1 },
    video: { mp4: 1, webm: 1, ogv: 1, m4v: 1, mov: 1 },
    audio: { mp3: 1, wav: 1, ogg: 1, oga: 1, m4a: 1, flac: 1, aac: 1, opus: 1 },
    doc: { pdf: 1 },
    text: { txt: 1, md: 1, markdown: 1, json: 1, xml: 1, csv: 1, log: 1, yml: 1, yaml: 1, ini: 1, conf: 1, html: 1, htm: 1, css: 1, js: 1, ts: 1, go: 1, py: 1, java: 1, c: 1, h: 1, cpp: 1, rs: 1, sh: 1, bat: 1, ps1: 1 }
  };
  var TEXT_PREVIEW_MAX = 1024 * 1024;
  var MEDIA_HOVER_DELAY = 600;

  function el(tag, className) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    return e;
  }

  function setStatus(id, message, isError) {
    var node = document.getElementById(id);
    node.textContent = message || "";
    node.style.display = message ? "block" : "none";
    node.className = "status" + (isError ? " error" : "");
  }

  function setCount(id, n) {
    document.getElementById(id).textContent = n > 0 ? n : "";
  }

  // 复制到剪贴板：优先 navigator.clipboard，降级 execCommand。
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.top = "-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error("execCommand 复制失败"));
      } catch (e) {
        reject(e);
      }
    });
  }

  function bindCopy(btn, feedback, getText) {
    btn.addEventListener("click", function () {
      copyText(getText()).then(
        function () {
          btn.classList.add("copied");
          btn.innerHTML = CHECK_ICON;
          feedback.textContent = "已复制到剪贴板";
          feedback.className = "copy-feedback ok";
          setTimeout(function () {
            btn.classList.remove("copied");
            btn.innerHTML = COPY_ICON;
            feedback.textContent = "";
            feedback.className = "copy-feedback";
          }, 2000);
        },
        function () {
          feedback.textContent = "复制失败，请手动选择文本复制";
          feedback.className = "copy-feedback err";
        }
      );
    });
  }

  function fileExt(name) {
    var i = name.lastIndexOf(".");
    if (i < 0 || i === name.length - 1) return "";
    return name.slice(i + 1).toLowerCase();
  }

  function displayName(name) {
    try {
      return decodeURIComponent(name);
    } catch (e) {
      return name;
    }
  }

  function fileKind(name) {
    var ext = fileExt(name);
    for (var i = 0; i < FILE_CATEGORIES.length; i++) {
      var cat = FILE_CATEGORIES[i];
      if (cat.exts && cat.exts.indexOf(ext) >= 0) return cat;
    }
    return FILE_CATEGORIES[FILE_CATEGORIES.length - 1];
  }

  function previewKind(name) {
    var ext = fileExt(name);
    var cat = fileKind(name);
    return PREVIEW_EXTS[cat.id] && PREVIEW_EXTS[cat.id][ext] ? cat.id : "";
  }

  function fileURL(name, inline) {
    var url = "/files/" + encodeURIComponent(name);
    return inline ? url + "?inline=1" : url;
  }

  function groupFiles(files) {
    var buckets = {};
    files.forEach(function (name) {
      var id = fileKind(name).id;
      if (!buckets[id]) buckets[id] = [];
      buckets[id].push(name);
    });
    return FILE_CATEGORIES.map(function (cat) {
      return { cat: cat, files: buckets[cat.id] || [] };
    }).filter(function (g) {
      return g.files.length > 0;
    });
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function canFineHover() {
    return window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  }

  function hideMediaHover() {
    var pop = document.getElementById("media-hover");
    var img = document.getElementById("media-hover-img");
    if (pop) pop.hidden = true;
    if (img) {
      img.onload = null;
      img.removeAttribute("src");
    }
    var tiles = document.querySelectorAll(".media-tile.is-playing");
    for (var i = 0; i < tiles.length; i++) {
      stopTileVideo(tiles[i]);
    }
  }

  function stopTileVideo(tile) {
    if (!tile) return;
    tile.classList.remove("is-playing");
    var v = tile.querySelector("video");
    if (v) {
      v.pause();
      try { v.currentTime = 0.1; } catch (e) {}
    }
  }

  function positionMediaHover(anchor) {
    var pop = document.getElementById("media-hover");
    if (!pop || pop.hidden || !anchor) return;
    var r = anchor.getBoundingClientRect();
    var pw = pop.offsetWidth;
    var ph = pop.offsetHeight;
    var gap = 12;
    var left = r.right + gap;
    if (left + pw > window.innerWidth - 8) {
      left = r.left - gap - pw;
    }
    if (left < 8) {
      left = Math.max(8, (window.innerWidth - pw) / 2);
    }
    var top = r.top + r.height / 2 - ph / 2;
    top = Math.max(8, Math.min(top, window.innerHeight - ph - 8));
    pop.style.left = Math.round(left) + "px";
    pop.style.top = Math.round(top) + "px";
  }

  function showImageHover(tile, name) {
    var pop = document.getElementById("media-hover");
    var img = document.getElementById("media-hover-img");
    var cap = document.getElementById("media-hover-caption");
    if (!pop || !img || !cap) return;
    var shown = displayName(name);
    cap.textContent = shown;
    img.alt = shown;
    img.onload = function () {
      pop.hidden = false;
      positionMediaHover(tile);
    };
    img.src = fileURL(name, true);
    if (img.complete && img.naturalWidth) {
      pop.hidden = false;
      positionMediaHover(tile);
    }
  }

  function startMediaHover(tile, name, kind) {
    var overlay = document.getElementById("preview-overlay");
    if (overlay && !overlay.hidden) return;
    if (kind === "video") {
      if (prefersReducedMotion()) return;
      var v = tile.querySelector("video");
      if (!v) return;
      v.loop = true;
      v.muted = true;
      v.playsInline = true;
      var play = v.play();
      if (play && play.catch) play.catch(function () {});
      tile.classList.add("is-playing");
      return;
    }
    if (kind === "image") {
      showImageHover(tile, name);
    }
  }

  function bindMediaHover(tile, name, kind) {
    var hoverTimer = null;
    var holdPlayed = false;

    function clearHoverTimer() {
      if (hoverTimer) {
        clearTimeout(hoverTimer);
        hoverTimer = null;
      }
    }

    function armHover() {
      clearHoverTimer();
      hoverTimer = setTimeout(function () {
        hoverTimer = null;
        startMediaHover(tile, name, kind);
      }, MEDIA_HOVER_DELAY);
    }

    function cancelHover() {
      clearHoverTimer();
      hideMediaHover();
    }

    if (canFineHover()) {
      tile.addEventListener("mouseenter", armHover);
      tile.addEventListener("mouseleave", cancelHover);
    }

    tile.addEventListener("touchstart", function () {
      holdPlayed = false;
      clearHoverTimer();
      hoverTimer = setTimeout(function () {
        hoverTimer = null;
        holdPlayed = true;
        startMediaHover(tile, name, kind);
      }, MEDIA_HOVER_DELAY);
    }, { passive: true });
    tile.addEventListener("touchend", function (ev) {
      clearHoverTimer();
      if (holdPlayed) {
        ev.preventDefault();
        hideMediaHover();
      }
    });
    tile.addEventListener("touchcancel", function () {
      clearHoverTimer();
      hideMediaHover();
    });
    tile.addEventListener("touchmove", clearHoverTimer, { passive: true });

    tile._consumeHoldClick = function () {
      if (!holdPlayed) return false;
      holdPlayed = false;
      return true;
    };
  }

  function appendMediaTile(grid, name) {
    var kind = previewKind(name);
    var cat = fileKind(name);
    var shown = displayName(name);
    var downloadHref = fileURL(name, false);
    var previewHref = fileURL(name, true);

    var li = el("li", "media-tile");
    var hit = el("a", "media-tile__hit");
    hit.href = kind ? previewHref : downloadHref;
    hit.title = shown;
    hit.setAttribute("aria-label", shown);
    if (!kind) hit.setAttribute("download", "");

    if (kind === "image") {
      var img = document.createElement("img");
      img.className = "media-thumb";
      img.alt = "";
      img.loading = "lazy";
      img.src = previewHref;
      img.onerror = function () {
        var fallback = el("div", "media-fallback");
        fallback.innerHTML = cat.icon;
        if (img.parentNode) img.parentNode.replaceChild(fallback, img);
      };
      hit.appendChild(img);
    } else if (kind === "video" || cat.id === "video") {
      var vid = document.createElement("video");
      vid.className = "media-thumb";
      vid.muted = true;
      vid.preload = "metadata";
      vid.playsInline = true;
      vid.setAttribute("playsinline", "");
      vid.src = previewHref;
      vid.addEventListener("loadeddata", function () {
        try { vid.currentTime = 0.1; } catch (e) {}
      });
      vid.addEventListener("error", function () {
        var fallback = el("div", "media-fallback");
        fallback.innerHTML = cat.icon;
        if (vid.parentNode) vid.parentNode.replaceChild(fallback, vid);
      });
      hit.appendChild(vid);
      var badge = el("span", "media-badge");
      badge.innerHTML = PLAY_ICON;
      li.appendChild(badge);
    } else {
      var fallback = el("div", "media-fallback");
      fallback.innerHTML = cat.icon;
      hit.appendChild(fallback);
    }

    if (kind) {
      hit.addEventListener("click", function (ev) {
        if (li._consumeHoldClick && li._consumeHoldClick()) {
          ev.preventDefault();
          return;
        }
        if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
        ev.preventDefault();
        hideMediaHover();
        openPreview(name, kind);
      });
      bindMediaHover(li, name, kind);
    }

    var nameEl = el("span", "media-name");
    nameEl.textContent = shown;
    var dl = el("a", "media-dl");
    dl.href = downloadHref;
    dl.setAttribute("download", "");
    dl.title = "下载";
    dl.setAttribute("aria-label", "下载 " + shown);
    dl.innerHTML = DOWNLOAD_ICON;
    dl.addEventListener("click", function (ev) {
      ev.stopPropagation();
    });

    li.appendChild(hit);
    li.appendChild(nameEl);
    li.appendChild(dl);
    grid.appendChild(li);
  }

  function appendFileRow(list, name) {
    var kind = previewKind(name);
    var cat = fileKind(name);
    var shown = displayName(name);
    var downloadHref = fileURL(name, false);
    var previewHref = fileURL(name, true);

    var li = el("li");
    var row = el("div", "file-row");

    var main = el("a", "file-main");
    main.href = kind ? previewHref : downloadHref;
    if (!kind) main.setAttribute("download", "");
    var ico = el("span");
    ico.innerHTML = cat.icon;
    main.appendChild(ico);
    var fname = el("span", "fname");
    fname.textContent = shown;
    main.appendChild(fname);
    if (kind) {
      main.addEventListener("click", function (ev) {
        if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
        ev.preventDefault();
        openPreview(name, kind);
      });
    }
    row.appendChild(main);

    if (kind) {
      var previewBtn = el("button", "file-action");
      previewBtn.type = "button";
      previewBtn.title = "预览";
      previewBtn.setAttribute("aria-label", "预览 " + shown);
      previewBtn.innerHTML = EYE_ICON;
      previewBtn.addEventListener("click", function () {
        openPreview(name, kind);
      });
      row.appendChild(previewBtn);
    }

    var dl = el("a", "file-action");
    dl.href = downloadHref;
    dl.setAttribute("download", "");
    dl.title = "下载";
    dl.setAttribute("aria-label", "下载 " + shown);
    dl.innerHTML = DOWNLOAD_ICON;
    row.appendChild(dl);

    li.appendChild(row);
    list.appendChild(li);
  }

  function renderFiles(files) {
    hideMediaHover();
    var root = document.getElementById("files-list");
    root.innerHTML = "";
    setCount("files-count", files.length);
    if (!files.length) {
      setStatus("files-status", "files/ 目录为空，暂无可下载文件。", false);
      return;
    }
    setStatus("files-status", "", false);
    groupFiles(files).forEach(function (group) {
      var section = el("div", "file-group");
      var title = el("div", "file-group-title");
      title.appendChild(document.createTextNode(group.cat.label + " "));
      var count = el("span", "count");
      count.textContent = group.files.length;
      title.appendChild(count);
      section.appendChild(title);

      if (group.cat.id === "image" || group.cat.id === "video") {
        var grid = el("ul", "media-grid");
        group.files.forEach(function (name) {
          appendMediaTile(grid, name);
        });
        section.appendChild(grid);
      } else {
        var ul = el("ul", "file-list");
        group.files.forEach(function (name) {
          appendFileRow(ul, name);
        });
        section.appendChild(ul);
      }
      root.appendChild(section);
    });
  }

  function clearPreviewMedia(body) {
    var media = body.querySelectorAll("video, audio");
    for (var i = 0; i < media.length; i++) {
      media[i].pause();
      media[i].removeAttribute("src");
      media[i].load();
    }
    body.innerHTML = "";
  }

  function closePreview() {
    var overlay = document.getElementById("preview-overlay");
    if (!overlay || overlay.hidden) return;
    clearPreviewMedia(document.getElementById("preview-body"));
    overlay.hidden = true;
    document.body.style.overflow = "";
    hideMediaHover();
  }

  function showPreviewHint(body, message) {
    var p = el("p", "preview-hint");
    p.textContent = message;
    body.appendChild(p);
  }

  function openPreview(name, kind) {
    var overlay = document.getElementById("preview-overlay");
    var dialog = document.getElementById("preview-dialog");
    var title = document.getElementById("preview-title");
    var body = document.getElementById("preview-body");
    var dl = document.getElementById("preview-download");
    if (!overlay || !dialog || !title || !body || !dl) return;

    var shown = displayName(name);
    var previewHref = fileURL(name, true);
    title.textContent = shown;
    title.title = shown;
    dl.href = fileURL(name, false);
    dl.innerHTML = DOWNLOAD_ICON;
    dialog.className = "preview-dialog" + (kind === "image" || kind === "video" || kind === "audio" ? " is-media" : "");
    clearPreviewMedia(body);

    if (kind === "image") {
      showPreviewHint(body, "加载中…");
      var img = document.createElement("img");
      img.alt = shown;
      img.src = previewHref;
      img.onload = function () {
        body.innerHTML = "";
        body.appendChild(img);
      };
      img.onerror = function () {
        body.innerHTML = "";
        showPreviewHint(body, "图片无法预览，请下载后查看");
      };
    } else if (kind === "video") {
      var video = document.createElement("video");
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;
      video.src = previewHref;
      body.appendChild(video);
    } else if (kind === "audio") {
      var audio = document.createElement("audio");
      audio.controls = true;
      audio.autoplay = true;
      audio.src = previewHref;
      body.appendChild(audio);
    } else if (kind === "doc") {
      var frame = document.createElement("iframe");
      frame.title = shown;
      frame.src = previewHref;
      body.appendChild(frame);
    } else if (kind === "text") {
      showPreviewHint(body, "加载中…");
      fetch(previewHref, { cache: "no-store" })
        .then(function (resp) {
          if (!resp.ok) throw new Error("服务器返回 " + resp.status);
          var len = parseInt(resp.headers.get("Content-Length") || "", 10);
          if (len > TEXT_PREVIEW_MAX) {
            throw new Error("too-large");
          }
          return resp.arrayBuffer();
        })
        .then(function (buf) {
          if (buf.byteLength > TEXT_PREVIEW_MAX) throw new Error("too-large");
          var text = new TextDecoder("utf-8", { fatal: false }).decode(buf);
          body.innerHTML = "";
          var pre = el("pre");
          pre.textContent = text;
          body.appendChild(pre);
        })
        .catch(function (err) {
          body.innerHTML = "";
          showPreviewHint(body, err && err.message === "too-large"
            ? "文件超过 1MB，请下载后查看"
            : "文本无法预览，请下载后查看");
        });
    } else {
      showPreviewHint(body, "该类型暂不支持预览");
    }

    overlay.hidden = false;
    document.body.style.overflow = "hidden";
    document.getElementById("preview-close").focus();
  }

  function bindPreview() {
    var overlay = document.getElementById("preview-overlay");
    var dialog = document.getElementById("preview-dialog");
    var closeBtn = document.getElementById("preview-close");
    if (!overlay || !dialog || !closeBtn) return;
    closeBtn.innerHTML = CLOSE_ICON;
    closeBtn.addEventListener("click", closePreview);
    overlay.addEventListener("click", function (ev) {
      if (ev.target === overlay) closePreview();
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") {
        hideMediaHover();
        closePreview();
      }
    });
    window.addEventListener("scroll", hideMediaHover, { passive: true });
    window.addEventListener("resize", hideMediaHover);
  }

  // 渲染单行文本
  function renderLines(lines) {
    var list = document.getElementById("lines-list");
    list.innerHTML = "";
    setCount("lines-count", lines.length);
    if (!lines.length) {
      setStatus("lines-status", "lines/ 目录为空，暂无单行文本。", false);
      return;
    }
    setStatus("lines-status", "", false);
    lines.forEach(function (item) {
      var wrap = el("div", "item");

      var title = el("div", "item-title");
      title.textContent = item.title;
      wrap.appendChild(title);

      var box = el("div", "copy-snippet");

      var code = el("code", "copy-snippet__text");
      // 单行展示：换行替换为空格再 trim；超出宽度时以省略号缩略，悬停显示完整内容。
      var oneLine = item.text.replace(/[\r\n]+/g, " ").trim();
      code.textContent = oneLine;
      code.title = oneLine;

      var btn = el("button", "copy-btn");
      btn.type = "button";
      btn.title = "复制";
      btn.innerHTML = COPY_ICON;

      box.appendChild(code);
      box.appendChild(btn);
      wrap.appendChild(box);

      var feedback = el("div", "copy-feedback");
      wrap.appendChild(feedback);

      bindCopy(btn, feedback, function () {
        return oneLine;
      });

      list.appendChild(wrap);
    });
  }

  // 渲染长文本
  function renderTexts(texts) {
    var list = document.getElementById("texts-list");
    list.innerHTML = "";
    setCount("texts-count", texts.length);
    if (!texts.length) {
      setStatus("texts-status", "texts/ 目录为空，暂无长文本。", false);
      return;
    }
    setStatus("texts-status", "", false);
    texts.forEach(function (item) {
      var wrap = el("div", "item");

      var title = el("div", "item-title");
      title.textContent = item.title;
      wrap.appendChild(title);

      var box = el("div", "copy-multiline");

      var btn = el("button", "copy-btn copy-multiline__btn");
      btn.type = "button";
      btn.title = "复制";
      btn.innerHTML = COPY_ICON;

      var pre = el("pre", "copy-multiline__text");
      pre.textContent = item.text;

      box.appendChild(btn);
      box.appendChild(pre);
      wrap.appendChild(box);

      var feedback = el("div", "copy-feedback");
      wrap.appendChild(feedback);

      // 长文本复制：保留原始换行。
      bindCopy(btn, feedback, function () {
        return item.text;
      });

      list.appendChild(wrap);
    });
  }

  // 安全渲染：单个区域出错不影响其它区域，并把错误显示在对应区域。
  function safeRender(name, statusId, fn, arg) {
    try {
      fn(arg);
    } catch (e) {
      console.error("渲染 " + name + " 失败：", e);
      setStatus(statusId, "渲染失败：" + (e && e.message ? e.message : e), true);
    }
  }

  function load() {
    fetch("/api/list", { cache: "no-store" })
      .then(function (resp) {
        if (!resp.ok) {
          throw new Error("服务器返回状态 " + resp.status);
        }
        return resp.json();
      })
      .then(function (data) {
        safeRender("文件", "files-status", renderFiles, Array.isArray(data.files) ? data.files : []);
        safeRender("单行文本", "lines-status", renderLines, Array.isArray(data.lines) ? data.lines : []);
        safeRender("长文本", "texts-status", renderTexts, Array.isArray(data.texts) ? data.texts : []);
      })
      .catch(function (err) {
        var msg = "加载失败：" + (err && err.message ? err.message : "无法连接到服务器");
        setStatus("files-status", msg, true);
        setStatus("lines-status", msg, true);
        setStatus("texts-status", msg, true);
      });
  }

  function loadVersion() {
    var node = document.getElementById("app-version");
    if (!node) return;
    fetch("/api/version", { cache: "no-store" })
      .then(function (resp) { return resp.ok ? resp.json() : null; })
      .then(function (v) {
        if (!v) return;
        var parts = [];
        if (v.version) parts.push(v.version);
        if (v.buildTime && v.buildTime !== "unknown") parts.push(v.buildTime);
        if (v.commit && v.commit !== "unknown") parts.push(v.commit.slice(0, 7));
        node.textContent = "";
        if (!parts.length) return;
        node.appendChild(document.createTextNode("版本 " + parts.join(" · ")));
        if (v.updateAvailable && v.latestVersion) {
          node.appendChild(document.createTextNode(" · "));
          var a = document.createElement("a");
          a.href = v.releaseURL || "https://github.com/zhongwcool/AceShare/releases";
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "update-hint";
          a.textContent = "有新版本 " + v.latestVersion;
          node.appendChild(a);
        }
      })
      .catch(function () {});
  }

  // 粘贴录入：提交到 /api/paste，成功后 SSE 会自动刷新列表。
  function setPasteMsg(message, kind) {
    var node = document.getElementById("paste-msg");
    if (!node) return;
    node.textContent = message || "";
    node.className = "paste-msg" + (kind ? " " + kind : "");
  }

  function bindPasteForm() {
    var form = document.getElementById("paste-form");
    var textEl = document.getElementById("paste-text");
    var titleEl = document.getElementById("paste-title");
    var titleRow = document.getElementById("paste-title-row");
    var submitBtn = document.getElementById("paste-submit");
    var addTitleBtn = document.getElementById("paste-add-title");
    if (!form || !textEl) return;

    addTitleBtn.addEventListener("click", function () {
      titleRow.classList.add("is-open");
      addTitleBtn.hidden = true;
      titleEl.focus();
    });

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var text = textEl.value;
      if (!String(text).trim()) {
        setPasteMsg("请先粘贴或输入内容", "err");
        textEl.focus();
        return;
      }
      submitBtn.disabled = true;
      setPasteMsg("正在保存…", "");
      var title = titleRow.classList.contains("is-open") ? (titleEl.value || "") : "";
      fetch("/api/paste", {
        method: "POST",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify({
          title: title,
          text: text,
          kind: "auto"
        })
      })
        .then(function (resp) {
          return resp.text().then(function (body) {
            if (!resp.ok) {
              throw new Error(body || ("服务器返回 " + resp.status));
            }
            try {
              return JSON.parse(body);
            } catch (e) {
              return {};
            }
          });
        })
        .then(function (data) {
          var kindLabel = data.kind === "line" ? "单行文本" : "长文本";
          var savedTitle = data.title || "";
          setPasteMsg("已保存为" + kindLabel + (savedTitle ? "「" + savedTitle + "」" : ""), "ok");
          textEl.value = "";
          titleEl.value = "";
          titleRow.classList.remove("is-open");
          addTitleBtn.hidden = false;
          // SSE 通常会自动刷新；此处再拉一次，确保即时看到结果。
          scheduleReload();
        })
        .catch(function (err) {
          setPasteMsg("保存失败：" + (err && err.message ? err.message : err), "err");
        })
        .then(function () {
          submitBtn.disabled = false;
        });
    });
  }

  // 自动刷新：优先用 SSE 实时接收变化通知；SSE 不可用或断线时回退为定时轮询。
  var reloadTimer = null;
  function scheduleReload() {
    if (reloadTimer) clearTimeout(reloadTimer);
    reloadTimer = setTimeout(load, 150);
  }

  var pollTimer = null;
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(load, 5000);
  }
  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function startAutoRefresh() {
    if (typeof EventSource === "undefined") {
      startPolling(); // 浏览器不支持 SSE，直接轮询
      return;
    }
    var es;
    try {
      es = new EventSource("/api/events");
    } catch (e) {
      startPolling();
      return;
    }
    es.addEventListener("change", function (ev) {
      // init 事件是连接建立时的初始同步，无需重复加载首屏。
      if (ev.data === "init") return;
      scheduleReload();
    });
    es.onopen = function () {
      stopPolling(); // SSE 正常，停止兜底轮询
    };
    es.onerror = function () {
      // 连接出错时启用轮询兜底；浏览器会自动尝试重连 SSE。
      startPolling();
    };
  }

  function init() {
    load();
    loadVersion();
    bindPasteForm();
    bindPreview();
    startAutoRefresh();
  }

  // 脚本位于 body 末尾，DOMContentLoaded 可能已触发，需兼容两种情况。
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
