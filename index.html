<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<title>局域网文件与文本分享</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --panel-2: #f0f2f5;
    --border: #e2e5ea;
    --text: #1f2328;
    --text-dim: #6b7280;
    --accent: #2f6feb;
    --accent-text: #ffffff;
    --code-bg: #f6f8fa;
    --code-border: #e2e5ea;
    --ok: #1a7f37;
    --err: #cf222e;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1c2129;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #9198a1;
      --accent: #4c8dff;
      --accent-text: #0d1117;
      --code-bg: #0b0f14;
      --code-border: #30363d;
      --ok: #3fb950;
      --err: #f85149;
      --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .page {
    flex: 1 1 auto;
    min-height: 0;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding-bottom: calc(3rem + env(safe-area-inset-bottom, 0px));
  }
  body.is-preview .page { overflow: hidden; }

  header {
    padding: 20px 24px 12px;
    max-width: 1200px;
    margin: 0 auto;
    text-align: center;
  }
  header h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
  header .app-version {
    margin: 0;
    color: var(--text-dim);
    font-size: 13px;
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
  }
  header .app-version a.update-hint {
    color: var(--ok);
    text-decoration: none;
    font-weight: 600;
  }
  header .app-version a.update-hint:hover {
    text-decoration: underline;
  }

  .layout {
    max-width: 1200px;
    margin: 0 auto;
    padding: 8px 24px 40px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 900px) {
    .layout { grid-template-columns: minmax(300px, 1fr) minmax(340px, 1.3fr); align-items: start; }
  }

  .col { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  @media (max-width: 899px) {
    .col-texts { order: 1; }
    .col-files { order: 2; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card > h2 {
    font-size: 14px;
    font-weight: 700;
    margin: 0;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card > h2 .count {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 1px 9px;
  }
  .card-body { padding: 14px 18px; }

  /* 状态提示 */
  .status { color: var(--text-dim); font-size: 14px; padding: 6px 2px; }
  .status.error { color: var(--err); }

  /* 文件列表 */
  ul.file-list { list-style: none; margin: 0; padding: 0; }
  ul.file-list li { border-bottom: 1px solid var(--border); }
  ul.file-list li:last-child { border-bottom: none; }
  ul.file-list .ico { flex: none; opacity: .7; }

  .file-groups { display: flex; flex-direction: column; gap: 16px; }
  .file-group-title {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 2px;
    padding: 0 4px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .file-group-title .count {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-dim);
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0 7px;
  }
  .file-row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 2px;
  }
  ul.file-list .file-main {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1 1 auto;
    min-width: 0;
    padding: 3px 4px;
    border-radius: 10px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    word-break: break-all;
    cursor: pointer;
  }
  ul.file-list .file-main:hover { color: var(--accent); background: rgba(127, 127, 127, 0.08); }
  ul.file-list .file-main .fname { min-width: 0; }
  ul.file-list .file-thumb {
    flex: none;
    width: 40px;
    height: 40px;
    object-fit: cover;
    border-radius: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
  }
  ul.file-list .file-action {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    margin: 0;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  ul.file-list .file-action svg { width: 17px; height: 17px; }
  ul.file-list .file-action:hover {
    color: var(--accent);
    background: rgba(127, 127, 127, 0.14);
  }
  ul.file-list .file-action.is-danger:hover { color: var(--err); }
  ul.file-list .file-action:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 相册网格（图片 / 视频） */
  .media-grid {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
    gap: 3px;
  }
  .media-tile {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 6px;
    background: #1a1d21;
  }
  .media-tile__hit {
    display: block;
    width: 100%;
    height: 100%;
    color: inherit;
    text-decoration: none;
  }
  .media-tile .media-thumb {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #1a1d21;
  }
  .media-tile .media-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    color: #c8cdd3;
  }
  .media-tile .media-fallback svg { width: 28px; height: 28px; opacity: .7; }
  .media-badge {
    position: absolute;
    left: 6px;
    bottom: 6px;
    z-index: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,.48);
    color: #fff;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  .media-badge svg { width: 12px; height: 12px; margin-left: 1px; }
  .media-tile.is-playing .media-badge { opacity: 0; }
  .media-name {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
    padding: 22px 8px 6px;
    font-size: 11px;
    line-height: 1.3;
    color: #fff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    background: linear-gradient(transparent, rgba(0,0,0,.55));
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .media-dl {
    position: absolute;
    top: 6px;
    right: 6px;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: rgba(0,0,0,.45);
    color: #fff;
    text-decoration: none;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s;
  }
  .media-del {
    position: absolute;
    top: 6px;
    left: 6px;
    z-index: 2;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    margin: 0;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,.45);
    color: #fff;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s, background 0.15s;
  }
  .media-dl svg, .media-del svg { width: 15px; height: 15px; }
  .media-dl:hover, .media-del:hover { background: rgba(0,0,0,.7); }
  .media-tile:hover .media-name,
  .media-tile:hover .media-dl,
  .media-tile:hover .media-del,
  .media-tile:focus-within .media-name,
  .media-tile:focus-within .media-dl,
  .media-tile:focus-within .media-del { opacity: 1; }
  .media-hover {
    position: fixed;
    z-index: 950;
    display: flex;
    flex-direction: column;
    max-width: min(480px, 72vw);
    max-height: min(72vh, 640px);
    background: #111318;
    border-radius: 12px;
    box-shadow: 0 18px 50px rgba(0,0,0,.38);
    overflow: hidden;
    pointer-events: none;
  }
  .media-hover[hidden] { display: none; }
  .media-hover img {
    display: block;
    max-width: min(480px, 72vw);
    max-height: min(64vh, 580px);
    object-fit: contain;
    background: #111318;
  }
  .media-hover-caption {
    flex: none;
    padding: 8px 12px;
    font-size: 12px;
    color: #e6edf3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* 文件预览浮层 */
  .preview-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(15, 18, 22, 0.58);
  }
  .preview-overlay[hidden] { display: none; }
  .preview-dialog {
    display: flex;
    flex-direction: column;
    min-width: min(280px, 92vw);
    max-width: min(960px, 100%);
    max-height: 92vh;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 16px 48px rgba(0,0,0,.28);
    overflow: hidden;
  }
  .preview-dialog:not(.is-media) { width: min(640px, 92vw); }
  .preview-dialog.is-doc {
    width: min(1100px, 96vw);
    height: min(92vh, 1000px);
  }
  .preview-dialog.is-doc .preview-body {
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }
  .preview-dialog.is-media { background: #111318; border-color: #2a2f36; }
  .preview-dialog.is-media .preview-title { color: #e6edf3; }
  .preview-dialog.is-media .preview-icon-btn { color: #9aa3ad; }
  .preview-dialog.is-media .preview-icon-btn:hover { color: #e6edf3; background: rgba(255,255,255,.1); }
  .preview-dialog.is-media .preview-icon-btn.is-danger:hover { color: #f85149; }
  .preview-header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: none;
    padding: 10px 12px 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  .preview-dialog.is-media .preview-header { border-bottom-color: #2a2f36; }
  .preview-title {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .preview-actions { display: flex; align-items: center; gap: 2px; flex: none; }
  .preview-icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  .preview-icon-btn:hover { background: rgba(127, 127, 127, 0.14); color: var(--text); }
  .preview-icon-btn.is-danger:hover { color: var(--err); }
  .preview-icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .preview-icon-btn svg { width: 18px; height: 18px; }
  .preview-body {
    overflow: auto;
    min-width: min(280px, 80vw);
  }
  .preview-body img {
    display: block;
    max-width: min(920px, 92vw);
    max-height: calc(92vh - 58px);
    object-fit: contain;
    margin: 0 auto;
    background:
      linear-gradient(45deg, #c8ccd2 25%, transparent 25%),
      linear-gradient(-45deg, #c8ccd2 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #c8ccd2 75%),
      linear-gradient(-45deg, transparent 75%, #c8ccd2 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
    background-color: #e8eaed;
  }
  .preview-body video,
  .preview-body audio {
    display: block;
    width: min(920px, 92vw);
  }
  .preview-body video { max-height: calc(92vh - 58px); background: #000; }
  .preview-body audio { padding: 28px 20px; }
  .preview-body iframe {
    display: block;
    width: 100%;
    height: min(78vh, 820px);
    border: 0;
    background: #525659;
    color-scheme: light;
  }
  .preview-dialog.is-doc .preview-body iframe {
    height: 100%;
    min-height: min(70vh, 720px);
  }
  .preview-body pre {
    margin: 0;
    padding: 14px 16px;
    max-width: min(920px, 92vw);
    max-height: calc(92vh - 58px);
    overflow: auto;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }
  .preview-hint {
    margin: 0;
    padding: 28px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }

  /* 文本条目通用（参考 nginx 原页风格）*/
  .item { margin-top: 0.55rem; }
  .item:first-child { margin-top: 0.35rem; }
  .item-head {
    display: flex;
    align-items: flex-start;
    gap: 4px;
  }
  .item .item-title {
    flex: 1 1 auto;
    min-width: 0;
    margin: 0.05rem 0 0.1rem;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text);
    word-break: break-all;
  }
  .item-del {
    flex: none;
    margin: -0.15rem -0.25rem 0 0;
  }
  .item-del:hover { color: var(--err); }
  @media (hover: hover) and (pointer: fine) {
    .item-del,
    ul.file-list .file-action.is-danger {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
    }
    .item:hover .item-del,
    .item:focus-within .item-del,
    ul.file-list .file-row:hover .file-action.is-danger,
    ul.file-list .file-row:focus-within .file-action.is-danger {
      opacity: 1;
      pointer-events: auto;
    }
  }

  /* 单行文本（lines）：圆角浅色框 + 框内透明圆形复制按钮，内容自动换行不出横向滚动条 */
  .copy-snippet {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
    padding: 0.65rem 0.75rem 0.65rem 1rem;
    border: 1px solid var(--code-border);
    border-radius: 9999px;
    background: var(--code-bg);
    min-width: 0;
    max-width: 100%;
  }
  .copy-snippet__text {
    flex: 1 1 0;
    width: 0;
    min-width: 0;
    margin: 0;
    padding: 0.15rem 0;
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
    font-size: 0.85rem;
    line-height: 1.45;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .copy-snippet__actions {
    display: flex;
    align-items: center;
    flex-shrink: 0;
    gap: 2px;
    margin: -0.15rem -0.25rem -0.15rem 0;
  }
  .copy-snippet__actions .copy-btn { margin: 0; }

  /* 长文本（texts）：圆角框 + 右上角透明复制按钮 */
  .copy-multiline {
    position: relative;
    display: flex;
    flex-direction: column;
    margin-top: 0.5rem;
    padding: 0.62rem 0.7rem;
    border: 1px solid var(--code-border);
    border-radius: 14px;
    background: var(--code-bg);
  }
  .copy-multiline__text {
    margin: 0;
    padding-right: 2.35rem;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
    font-size: 0.85rem;
    line-height: 1.5;
    color: var(--text);
  }

  /* 透明圆形复制按钮 */
  .copy-btn {
    flex-shrink: 0;
    align-self: center;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.25rem;
    height: 2.25rem;
    margin: -0.15rem -0.25rem -0.15rem 0;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .copy-btn:hover {
    background: rgba(127, 127, 127, 0.14);
    color: var(--text);
  }
  .copy-btn:active { background: rgba(127, 127, 127, 0.22); }
  .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .copy-btn.copied { color: var(--ok); }
  .copy-btn svg { width: 18px; height: 18px; }
  a.copy-btn { text-decoration: none; }
  .copy-multiline__btn { position: absolute; top: 0.22rem; right: 0.22rem; align-self: auto; margin: 0; }
  .copy-multiline.has-link .copy-multiline__text { padding-right: 5rem; }
  .copy-multiline__open {
    position: absolute;
    top: 0.22rem;
    right: 2.6rem;
    align-self: auto;
    margin: 0;
  }

  .copy-feedback {
    margin: 0.12rem 0 0 0.2rem;
    font-size: 0.75rem;
    min-height: 0.85em;
    color: var(--ok);
  }
  .copy-feedback.err { color: var(--err); }

  /* 粘贴录入 */
  .paste-form { display: flex; flex-direction: column; gap: 10px; }
  .paste-form label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .paste-form input[type="text"],
  .paste-form textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--code-bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .paste-form input[type="text"]:focus,
  .paste-form textarea:focus {
    border-color: var(--accent);
  }
  .paste-form textarea {
    min-height: 96px;
    resize: vertical;
    font-family: ui-monospace, "Cascadia Code", "Consolas", monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  /* 空内容时提示「点一下即可尝试粘贴」 */
  .paste-form textarea:placeholder-shown { cursor: pointer; }
  .paste-title-row { display: none; }
  .paste-title-row.is-open { display: block; }
  .paste-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .paste-actions button {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .paste-actions .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  .paste-actions .btn-primary:hover { filter: brightness(1.08); }
  .paste-actions .btn-primary:disabled {
    opacity: 0.55;
    cursor: not-allowed;
    filter: none;
  }
  .paste-actions .btn-secondary {
    background: var(--panel-2);
    color: var(--text);
  }
  .paste-actions .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .paste-msg,
  .upload-msg {
    font-size: 12px;
    min-height: 1.2em;
    color: var(--text-dim);
  }
  .paste-msg.ok, .upload-msg.ok { color: var(--ok); }
  .paste-msg.err, .upload-msg.err { color: var(--err); }
  .paste-msg a { color: var(--accent); }

  .upload-fab {
    position: fixed;
    z-index: 70;

  // 不能先 await permissions.query，否则会丢掉用户手势，弹窗出不来。
  function requestClipboardAndRead() {
    var readP = readClipboardText();
    return readP.catch(function (err) {
      if (!err || err.name !== "NotAllowedError") throw err;
      return queryClipboardPermission().then(function (state) {
        if (state === "granted") return readClipboardText();
        throw err;
      });
    });
  }

  function pasteShortcutLabel(client) {
    if (client.isiOS || client.isAndroid) return "长按粘贴";
    return client.isMac ? "⌘V" : "Ctrl+V";
  }

  function clipboardPermissionHint(client) {
    if (client.isiOS) return "请在顶部点「允许粘贴」";
    if (client.isAndroid) return "请允许读取剪贴板";
    return "请在弹窗中允许读取剪贴板";
  }

  function defaultPastePlaceholder(client) {
    if (canReadClipboardApi()) {
      if (client.isiOS) return "点按后允许粘贴，也可直接输入";
      if (client.isAndroid) return "点按后允许读取剪贴板，也可直接输入";
      return "点击后允许读取剪贴板，或直接输入 / " + (client.isMac ? "⌘V" : "Ctrl+V");
    }
    if (client.isMobile) return "点按后长按粘贴，或直接输入";
    return "在此粘贴或输入文本，" + (client.isMac ? "⌘V" : "Ctrl+V");
  }

  function clipboardFallbackMsg(err, client, permState) {
    var name = err && err.name;
    if (permState === "denied" || name === "NotAllowedError") {
      if (permState === "denied") {
        if (client.isMobile) return "已拒绝剪贴板权限，请长按输入框选择「粘贴」";
        return "已拒绝剪贴板权限，请点地址栏左侧重新允许，或按 " + pasteShortcutLabel(client) + " 粘贴";
      }
      if (client.isiOS) return "未允许粘贴，可再点一次，或长按输入框选择「粘贴」";
      if (client.isAndroid) return "未允许读取剪贴板，可再点一次，或长按输入框选择「粘贴」";
      return "未允许读取剪贴板，可再点一次，或按 " + pasteShortcutLabel(client) + " 粘贴";
    }
    if (!window.isSecureContext && !client.isMobile) {
      return "当前地址下 Chrome 不能读剪贴板，本机请改用";
    }
    if (client.isMobile) return "当前浏览器无法自动读取剪贴板，请长按输入框选择「粘贴」";
    return "当前浏览器无法自动读取剪贴板，请按 " + pasteShortcutLabel(client) + " 粘贴";
  }

  function clipboardFallbackLink(err, client) {
    if (client.isMobile) return "";
    if (!window.isSecureContext || (err && err.name === "SecurityError")) {
      return loopbackPageURL();
    }
    return "";
  }

  // 复制到剪贴板：优先 navigator.clipboard，降级 execCommand。
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.top = "-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error("execCommand 复制失败"));
      } catch (e) {
        reject(e);
      }
    });
  }

  function bindCopy(btn, feedback, getText) {
    btn.addEventListener("click", function () {
      copyText(getText()).then(
        function () {
          btn.classList.add("copied");
          btn.innerHTML = CHECK_ICON;
          feedback.textContent = "已复制到剪贴板";
          feedback.className = "copy-feedback ok";
          setTimeout(function () {
            btn.classList.remove("copied");
            btn.innerHTML = COPY_ICON;
            feedback.textContent = "";
            feedback.className = "copy-feedback";
          }, 2000);
        },
        function () {
          feedback.textContent = "复制失败，请手动选择文本复制";
          feedback.className = "copy-feedback err";
        }
      );
    });
  }

  function fileExt(name) {
    var i = name.lastIndexOf(".");
    if (i < 0 || i === name.length - 1) return "";
    return name.slice(i + 1).toLowerCase();
  }

  function displayName(name) {
    try {
      return decodeURIComponent(name);
    } catch (e) {
      return name;
    }
  }

  function fileKind(name) {
    var ext = fileExt(name);
    for (var i = 0; i < FILE_CATEGORIES.length; i++) {
      var cat = FILE_CATEGORIES[i];
      if (cat.exts && cat.exts.indexOf(ext) >= 0) return cat;
    }
    return FILE_CATEGORIES[FILE_CATEGORIES.length - 1];
  }

  function previewKind(name) {
    var ext = fileExt(name);
    var cat = fileKind(name);
    return PREVIEW_EXTS[cat.id] && PREVIEW_EXTS[cat.id][ext] ? cat.id : "";
  }

  function fileURL(name, inline) {
    var url = "/files/" + encodeURIComponent(name);
    return inline ? url + "?inline=1" : url;
  }

  var UNDO_MS = 5000;
  var lastList = { files: [], lines: [], texts: [] };
  var pendingDeletes = {};
  var lastPendingKey = "";
  var previewName = "";
  var previewObjectURL = "";
  var undoTickRaf = 0;

  function pendingKey(kind, name) {
    return kind + "\0" + name;
  }

  function visibleList() {
    return {
      files: lastList.files.filter(function (n) {
        return !pendingDeletes[pendingKey("file", n)];
      }),
      lines: lastList.lines.filter(function (item) {
        return !pendingDeletes[pendingKey("line", item.title)];
      }),
      texts: lastList.texts.filter(function (item) {
        return !pendingDeletes[pendingKey("text", item.title)];
      })
    };
  }

  function renderAll() {
    var data = visibleList();
    safeRender("文件", "files-status", renderFiles, data.files);
    safeRender("单行文本", "lines-status", renderLines, data.lines);
    safeRender("长文本", "texts-status", renderTexts, data.texts);
  }

  function formatUndoRemain(ms) {
    return Math.max(0, Math.ceil(ms / 1000)) + "s";
  }

  function stopUndoTick() {
    if (undoTickRaf) {
      cancelAnimationFrame(undoTickRaf);
      undoTickRaf = 0;
    }
  }

  function tickUndoToast() {
    undoTickRaf = 0;
    var count = document.getElementById("undo-toast-count");
    var item = pendingDeletes[lastPendingKey];
    if (!count || !item || item.committing) return;
    var left = item.deadline - Date.now();
    count.textContent = formatUndoRemain(left);
    if (left > 0) undoTickRaf = requestAnimationFrame(tickUndoToast);
  }

  function showUndoToast(label) {
    var toast = document.getElementById("undo-toast");
    var msg = document.getElementById("undo-toast-msg");
    var count = document.getElementById("undo-toast-count");
    if (!toast || !msg) return;
    msg.textContent = "已删除「" + label + "」";
    if (count) count.textContent = formatUndoRemain(UNDO_MS);
    toast.hidden = false;
    stopUndoTick();
    tickUndoToast();
  }

  function hideUndoToast() {
    stopUndoTick();
    var toast = document.getElementById("undo-toast");
    if (toast) toast.hidden = true;
  }

  function bindUndoToast() {
    var btn = document.getElementById("undo-toast-btn");
    if (!btn) return;
    btn.addEventListener("click", undoLastDelete);
  }

  function requestDelete(kind, name, label) {
    var key = pendingKey(kind, name);
    if (pendingDeletes[key]) return;
    hideMediaHover();
    if (kind === "file") closePreviewIfFile(name);
    pendingDeletes[key] = {
      kind: kind,
      name: name,
      label: label,
      deadline: Date.now() + UNDO_MS,
      timer: setTimeout(function () { commitDelete(key); }, UNDO_MS)
    };
    lastPendingKey = key;
    renderAll();
    showUndoToast(label);
  }

  function undoLastDelete() {
    var key = lastPendingKey;
    var item = pendingDeletes[key];
    if (!item || item.committing) return;
    clearTimeout(item.timer);
    delete pendingDeletes[key];
    lastPendingKey = "";
    hideUndoToast();
    renderAll();
  }

  function dropPendingFromLastList(item) {
    if (item.kind === "file") {
      lastList.files = lastList.files.filter(function (n) { return n !== item.name; });
    } else if (item.kind === "line") {
      lastList.lines = lastList.lines.filter(function (it) { return it.title !== item.name; });
    } else if (item.kind === "text") {
      lastList.texts = lastList.texts.filter(function (it) { return it.title !== item.name; });
    }
  }

  function commitDelete(key) {
    var item = pendingDeletes[key];
    if (!item || item.committing) return;
    item.committing = true;
    if (lastPendingKey === key) {
      lastPendingKey = "";
      hideUndoToast();
    }
    fetch("/api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json; charset=utf-8" },
      body: JSON.stringify({ kind: item.kind, name: item.name })
    })
      .then(function (resp) {
        return resp.text().then(function (body) {
          if (!resp.ok) throw new Error(body || ("服务器返回 " + resp.status));
        });
      })
      .then(function () {
        dropPendingFromLastList(item);
        delete pendingDeletes[key];
        if (lastPendingKey === key) {
          lastPendingKey = "";
          hideUndoToast();
        }
      })
      .catch(function (err) {
        clearTimeout(item.timer);
        delete pendingDeletes[key];
        if (lastPendingKey === key) {
          lastPendingKey = "";
          hideUndoToast();
        }
        renderAll();
        console.error("删除失败：", err);
        setStatus(
          item.kind === "file" ? "files-status" : (item.kind === "line" ? "lines-status" : "texts-status"),
          "删除失败：" + (err && err.message ? err.message : "无法连接到服务器"),
          true
        );
      });
  }

  function groupFiles(files) {
    var buckets = {};
    files.forEach(function (name) {
      var id = fileKind(name).id;
      if (!buckets[id]) buckets[id] = [];
      buckets[id].push(name);
    });
    return FILE_CATEGORIES.map(function (cat) {
      return { cat: cat, files: buckets[cat.id] || [] };
    }).filter(function (g) {
      return g.files.length > 0;
    });
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  }

  function canFineHover() {
    return window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  }

  function hideMediaHover() {
    var pop = document.getElementById("media-hover");
    var img = document.getElementById("media-hover-img");
    if (pop) pop.hidden = true;
    if (img) {
      img.onload = null;
      img.removeAttribute("src");
    }
    var tiles = document.querySelectorAll(".media-tile.is-playing");
    for (var i = 0; i < tiles.length; i++) {
      stopTileVideo(tiles[i]);
    }
  }

  function stopTileVideo(tile) {
    if (!tile) return;
    tile.classList.remove("is-playing");
    var v = tile.querySelector("video");
    if (v) {
      v.pause();
      try { v.currentTime = 0.1; } catch (e) {}
    }
  }

  function positionMediaHover(anchor) {
    var pop = document.getElementById("media-hover");
    if (!pop || pop.hidden || !anchor) return;
    var r = anchor.getBoundingClientRect();
    var pw = pop.offsetWidth;
    var ph = pop.offsetHeight;
    var gap = 12;
    var left = r.right + gap;
    if (left + pw > window.innerWidth - 8) {
      left = r.left - gap - pw;
    }
    if (left < 8) {
      left = Math.max(8, (window.innerWidth - pw) / 2);
    }
    var footer = document.querySelector("footer");
    var footerH = footer ? footer.getBoundingClientRect().height : 0;
    var top = r.top + r.height / 2 - ph / 2;
    top = Math.max(8, Math.min(top, window.innerHeight - footerH - ph - 8));
    pop.style.left = Math.round(left) + "px";
    pop.style.top = Math.round(top) + "px";
  }

  function showImageHover(tile, name) {
    var pop = document.getElementById("media-hover");
    var img = document.getElementById("media-hover-img");
    var cap = document.getElementById("media-hover-caption");
    if (!pop || !img || !cap) return;
    var shown = displayName(name);
    cap.textContent = shown;
    img.alt = shown;
    img.onload = function () {
      pop.hidden = false;
      positionMediaHover(tile);
    };
    img.src = fileURL(name, true);
    if (img.complete && img.naturalWidth) {
      pop.hidden = false;
      positionMediaHover(tile);
    }
  }

  function startMediaHover(tile, name, kind) {
    var overlay = document.getElementById("preview-overlay");
    if (overlay && !overlay.hidden) return;
    if (kind === "video") {
      if (prefersReducedMotion()) return;
      var v = tile.querySelector("video");
      if (!v) return;
      v.loop = true;
      v.muted = true;
      v.playsInline = true;
      var play = v.play();
      if (play && play.catch) play.catch(function () {});
      tile.classList.add("is-playing");
      return;
    }
    if (kind === "image") {
      showImageHover(tile, name);
    }
  }

  function bindMediaHover(tile, name, kind) {
    var hoverTimer = null;
    var holdPlayed = false;

    function clearHoverTimer() {
      if (hoverTimer) {
        clearTimeout(hoverTimer);
        hoverTimer = null;
      }
    }

    function armHover() {
      clearHoverTimer();
      hoverTimer = setTimeout(function () {
        hoverTimer = null;
        startMediaHover(tile, name, kind);
      }, MEDIA_HOVER_DELAY);
    }

    function cancelHover() {
      clearHoverTimer();
      hideMediaHover();
    }

    if (canFineHover()) {
      tile.addEventListener("mouseenter", armHover);
      tile.addEventListener("mouseleave", cancelHover);
    }

    tile.addEventListener("touchstart", function () {
      holdPlayed = false;
      clearHoverTimer();
      hoverTimer = setTimeout(function () {
        hoverTimer = null;
        holdPlayed = true;
        startMediaHover(tile, name, kind);
      }, MEDIA_HOVER_DELAY);
    }, { passive: true });
    tile.addEventListener("touchend", function (ev) {
      clearHoverTimer();
      if (holdPlayed) {
        ev.preventDefault();
        hideMediaHover();
      }
    });
    tile.addEventListener("touchcancel", function () {
      clearHoverTimer();
      hideMediaHover();
    });
    tile.addEventListener("touchmove", clearHoverTimer, { passive: true });

    tile._consumeHoldClick = function () {
      if (!holdPlayed) return false;
      holdPlayed = false;
      return true;
    };
  }

  function appendMediaTile(grid, name) {
    var kind = previewKind(name);
    var cat = fileKind(name);
    var shown = displayName(name);
    var downloadHref = fileURL(name, false);
    var previewHref = fileURL(name, true);

    var li = el("li", "media-tile");
    var hit = el("a", "media-tile__hit");
    hit.href = kind ? previewHref : downloadHref;
    hit.title = shown;
    hit.setAttribute("aria-label", shown);
    if (!kind) hit.setAttribute("download", "");

    if (kind === "image") {
      var img = document.createElement("img");
      img.className = "media-thumb";
      img.alt = "";
      img.loading = "lazy";
      img.src = previewHref;
      img.onerror = function () {
        var fallback = el("div", "media-fallback");
        fallback.innerHTML = cat.icon;
        if (img.parentNode) img.parentNode.replaceChild(fallback, img);
      };
      hit.appendChild(img);
    } else if (kind === "video" || cat.id === "video") {
      var vid = document.createElement("video");
      vid.className = "media-thumb";
      vid.muted = true;
      vid.preload = "metadata";
      vid.playsInline = true;
      vid.setAttribute("playsinline", "");
      vid.src = previewHref;
      vid.addEventListener("loadeddata", function () {
        try { vid.currentTime = 0.1; } catch (e) {}
      });
      vid.addEventListener("error", function () {
        var fallback = el("div", "media-fallback");
        fallback.innerHTML = cat.icon;
        if (vid.parentNode) vid.parentNode.replaceChild(fallback, vid);
      });
      hit.appendChild(vid);
      var badge = el("span", "media-badge");
      badge.innerHTML = PLAY_ICON;
      li.appendChild(badge);
    } else {
      var fallback = el("div", "media-fallback");
      fallback.innerHTML = cat.icon;
      hit.appendChild(fallback);
    }

    if (kind) {
      hit.addEventListener("click", function (ev) {
        if (li._consumeHoldClick && li._consumeHoldClick()) {
          ev.preventDefault();
          return;
        }
        if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
        ev.preventDefault();
        hideMediaHover();
        openPreview(name, kind);
      });
      bindMediaHover(li, name, kind);
    }

    var nameEl = el("span", "media-name");
    nameEl.textContent = shown;
    var dl = el("a", "media-dl");
    dl.href = downloadHref;
    dl.setAttribute("download", "");
    dl.title = "下载";
    dl.setAttribute("aria-label", "下载 " + shown);
    dl.innerHTML = DOWNLOAD_ICON;
    dl.addEventListener("click", function (ev) {
      ev.stopPropagation();
    });

    li.appendChild(hit);
    li.appendChild(nameEl);
    var del = el("button", "media-del");
    del.type = "button";
    del.title = "删除";
    del.setAttribute("aria-label", "删除 " + shown);
    del.innerHTML = TRASH_ICON;
    del.addEventListener("click", function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      requestDelete("file", name, shown);
    });
    li.appendChild(del);
    li.appendChild(dl);
    grid.appendChild(li);
  }

  function appendFileRow(list, name) {
    var kind = previewKind(name);
    var cat = fileKind(name);
    var shown = displayName(name);
    var downloadHref = fileURL(name, false);
    var previewHref = fileURL(name, true);

    var li = el("li");
    var row = el("div", "file-row");

    var main = el("a", "file-main");
    main.href = kind ? previewHref : downloadHref;
    if (!kind) main.setAttribute("download", "");
    var ico = el("span");
    ico.innerHTML = cat.icon;
    main.appendChild(ico);
    var fname = el("span", "fname");
    fname.textContent = shown;
    main.appendChild(fname);
    if (kind) {
      main.addEventListener("click", function (ev) {
        if (ev.defaultPrevented || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
        ev.preventDefault();
        openPreview(name, kind);
      });
    }
    row.appendChild(main);

    if (kind) {
      var previewBtn = el("button", "file-action");
      previewBtn.type = "button";
      previewBtn.title = "预览";
      previewBtn.setAttribute("aria-label", "预览 " + shown);
      previewBtn.innerHTML = EYE_ICON;
      previewBtn.addEventListener("click", function () {
        openPreview(name, kind);
      });
      row.appendChild(previewBtn);
    }

    var dl = el("a", "file-action");
    dl.href = downloadHref;
    dl.setAttribute("download", "");
    dl.title = "下载";
    dl.setAttribute("aria-label", "下载 " + shown);
    dl.innerHTML = DOWNLOAD_ICON;
    row.appendChild(dl);

    var del = el("button", "file-action is-danger");
    del.type = "button";
    del.title = "删除";
    del.setAttribute("aria-label", "删除 " + shown);
    del.innerHTML = TRASH_ICON;
    del.addEventListener("click", function () {
      requestDelete("file", name, shown);
    });
    row.appendChild(del);

    li.appendChild(row);
    list.appendChild(li);
  }

  function renderFiles(files) {
    hideMediaHover();
    var root = document.getElementById("files-list");
    root.innerHTML = "";
    setCount("files-count", files.length);
    if (!files.length) {
      setStatus("files-status", "暂无文件。可以点右下角的上传按钮，或把文件放进 files/ 目录。", false);
      return;
    }
    setStatus("files-status", "", false);
    groupFiles(files).forEach(function (group) {
      var section = el("div", "file-group");
      var title = el("div", "file-group-title");
      title.appendChild(document.createTextNode(group.cat.label + " "));
      var count = el("span", "count");
      count.textContent = group.files.length;
      title.appendChild(count);
      section.appendChild(title);

      if (group.cat.id === "image" || group.cat.id === "video") {
        var grid = el("ul", "media-grid");
        group.files.forEach(function (name) {
          appendMediaTile(grid, name);
        });
        section.appendChild(grid);
      } else {
        var ul = el("ul", "file-list");
        group.files.forEach(function (name) {
          appendFileRow(ul, name);
        });
        section.appendChild(ul);
      }
      root.appendChild(section);
    });
  }

  function revokePreviewObjectURL() {
    if (!previewObjectURL) return;
    URL.revokeObjectURL(previewObjectURL);
    previewObjectURL = "";
  }

  function clearPreviewMedia(body) {
    var media = body.querySelectorAll("video, audio");
    for (var i = 0; i < media.length; i++) {
      media[i].pause();
      media[i].removeAttribute("src");
      media[i].load();
    }
    revokePreviewObjectURL();
    body.innerHTML = "";
  }

  function closePreview() {
    var overlay = document.getElementById("preview-overlay");
    if (!overlay || overlay.hidden) return;
    clearPreviewMedia(document.getElementById("preview-body"));
    overlay.hidden = true;
    document.body.classList.remove("is-preview");
    previewName = "";
    hideMediaHover();
  }

  function closePreviewIfFile(name) {
    if (previewName === name) closePreview();
  }

  function showPreviewHint(body, message) {
    var p = el("p", "preview-hint");
    p.textContent = message;
    body.appendChild(p);
  }

  function openPreview(name, kind) {
    var overlay = document.getElementById("preview-overlay");
    var dialog = document.getElementById("preview-dialog");
    var title = document.getElementById("preview-title");
    var body = document.getElementById("preview-body");
    var dl = document.getElementById("preview-download");
    if (!overlay || !dialog || !title || !body || !dl) return;

    var shown = displayName(name);
    var previewHref = fileURL(name, true);
    previewName = name;
    title.textContent = shown;
    title.title = shown;
    dl.href = fileURL(name, false);
    dl.innerHTML = DOWNLOAD_ICON;
    var dialogKind = "";
    if (kind === "image" || kind === "video" || kind === "audio") dialogKind = " is-media";
    else if (kind === "doc") dialogKind = " is-doc";
    dialog.className = "preview-dialog" + dialogKind;
    clearPreviewMedia(body);

    if (kind === "image") {
      showPreviewHint(body, "加载中…");
      var img = document.createElement("img");
      img.alt = shown;
      img.src = previewHref;
      img.onload = function () {
        body.innerHTML = "";
        body.appendChild(img);
      };
      img.onerror = function () {
        body.innerHTML = "";
        showPreviewHint(body, "图片无法预览，请下载后查看");
      };
    } else if (kind === "video") {
      var video = document.createElement("video");
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;
      video.src = previewHref;
      body.appendChild(video);
    } else if (kind === "audio") {
      var audio = document.createElement("audio");
      audio.controls = true;
      audio.autoplay = true;
      audio.src = previewHref;
      body.appendChild(audio);
    } else if (kind === "doc") {
      // 不用带 .pdf 的地址打开预览。下载工具会拦截这种地址并弹出下载框。
      // 先用脚本取回字节，再交给浏览器内部的 blob 地址显示。
      showPreviewHint(body, "加载中…");
      var pdfName = name;
      fetch("/api/file", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        cache: "no-store",
        body: JSON.stringify({ name: name })
      })
        .then(function (resp) {
          if (!resp.ok) throw new Error("bad");
          return resp.blob();
        })
        .then(function (blob) {
          if (previewName !== pdfName) return;
          var pdfBlob = new Blob([blob], { type: "application/pdf" });
          var url = URL.createObjectURL(pdfBlob);
          previewObjectURL = url;
          body.innerHTML = "";
          var frame = document.createElement("iframe");
          frame.title = shown;
          frame.src = url;
          body.appendChild(frame);
        })
        .catch(function () {
          if (previewName !== pdfName) return;
          body.innerHTML = "";
          showPreviewHint(body, "无法预览。若仍弹出下载工具，请先关闭它再试，或直接下载查看");
        });
    } else if (kind === "text") {
      showPreviewHint(body, "加载中…");
      fetch(previewHref, { cache: "no-store" })
        .then(function (resp) {
          if (!resp.ok) throw new Error("服务器返回 " + resp.status);
          var len = parseInt(resp.headers.get("Content-Length") || "", 10);
          if (len > TEXT_PREVIEW_MAX) {
            throw new Error("too-large");
          }
          return resp.arrayBuffer();
        })
        .then(function (buf) {
          if (buf.byteLength > TEXT_PREVIEW_MAX) throw new Error("too-large");
          var text = new TextDecoder("utf-8", { fatal: false }).decode(buf);
          body.innerHTML = "";
          var pre = el("pre");
          pre.textContent = text;
          body.appendChild(pre);
        })
        .catch(function (err) {
          body.innerHTML = "";
          showPreviewHint(body, err && err.message === "too-large"
            ? "文件超过 1MB，请下载后查看"
            : "文本无法预览，请下载后查看");
        });
    } else {
      showPreviewHint(body, "该类型暂不支持预览");
    }

    overlay.hidden = false;
    document.body.classList.add("is-preview");
    document.getElementById("preview-close").focus();
  }

  function bindPreview() {
    var overlay = document.getElementById("preview-overlay");
    var dialog = document.getElementById("preview-dialog");
    var closeBtn = document.getElementById("preview-close");
    var delBtn = document.getElementById("preview-delete");
    if (!overlay || !dialog || !closeBtn) return;
    closeBtn.innerHTML = CLOSE_ICON;
    closeBtn.addEventListener("click", closePreview);
    if (delBtn) {
      delBtn.innerHTML = TRASH_ICON;
      delBtn.addEventListener("click", function () {
        if (!previewName) return;
        requestDelete("file", previewName, displayName(previewName));
      });
    }
    overlay.addEventListener("click", function (ev) {
      if (ev.target === overlay) closePreview();
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape") {
        hideMediaHover();
        closePreview();
      }
    });
    var page = document.querySelector(".page");
    if (page) page.addEventListener("scroll", hideMediaHover, { passive: true });
    window.addEventListener("scroll", hideMediaHover, { passive: true });
    window.addEventListener("resize", hideMediaHover);
  }

  // 从文本中提取 http(s) 链接。去掉首尾标点和紧挨着的中文，避免把说明文字算进地址。
  function extractHttpLinks(text) {
    if (!text) return [];
    var seen = Object.create(null);
    var out = [];
    var re = /https?:\/\/[^\s<>"'`]+/gi;
    var match;
    while ((match = re.exec(text)) !== null) {
      var url = trimUrlTail(match[0]);
      if (!url || seen[url]) continue;
      try {
        var parsed = new URL(url);
        if (parsed.protocol !== "http:" && parsed.protocol !== "https:") continue;
      } catch (e) {
        continue;
      }
      seen[url] = true;
      out.push(url);
    }
    return out;
  }

  function trimUrlTail(raw) {
    var url = String(raw).replace(/[^\x21-\x7E].*$/, "");
    var closers = {
      ")": "(",
      "]": "[",
      "}": "{",
      ">": "<"
    };
    var trail = ".,;:!?\"'`";
    while (url.length) {
      var last = url.charAt(url.length - 1);
      if (trail.indexOf(last) >= 0) {
        url = url.slice(0, -1);
        continue;
      }
      var open = closers[last];
      if (open) {
        var opens = 0;
        var closes = 0;
        var i;
        for (i = 0; i < url.length; i++) {
          var ch = url.charAt(i);
          if (ch === open) opens++;
          else if (ch === last) closes++;
        }
        if (closes > opens) {
          url = url.slice(0, -1);
          continue;
        }
      }
      break;
    }
    return url;
  }

  function makeOpenLink(url, extraClass) {
    var link = el("a", "copy-btn" + (extraClass ? " " + extraClass : ""));
    link.href = url;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.title = "打开";
    link.setAttribute("aria-label", "打开链接");
    link.innerHTML = OPEN_ICON;
    return link;
  }

  // 渲染单行文本
  function renderLines(lines) {
    var list = document.getElementById("lines-list");
    list.innerHTML = "";
    setCount("lines-count", lines.length);
    if (!lines.length) {
      setStatus("lines-status", "lines/ 目录为空，暂无单行文本。", false);
      return;
    }
    setStatus("lines-status", "", false);
    lines.forEach(function (item) {
      var wrap = el("div", "item");

      var head = el("div", "item-head");
      var title = el("div", "item-title");
      title.textContent = item.title;
      var del = el("button", "copy-btn item-del");
      del.type = "button";
      del.title = "删除";
      del.setAttribute("aria-label", "删除 " + item.title);
      del.innerHTML = TRASH_ICON;
      del.addEventListener("click", function () {
        requestDelete("line", item.title, item.title);
      });
      head.appendChild(title);
      head.appendChild(del);
      wrap.appendChild(head);

      var box = el("div", "copy-snippet");

      var code = el("code", "copy-snippet__text");
      // 单行展示：换行替换为空格再 trim；超出宽度时以省略号缩略，悬停显示完整内容。
      var oneLine = item.text.replace(/[\r\n]+/g, " ").trim();
      code.textContent = oneLine;
      code.title = oneLine;

      var actions = el("div", "copy-snippet__actions");
      var links = extractHttpLinks(item.text);
      if (links.length) actions.appendChild(makeOpenLink(links[0]));

      var btn = el("button", "copy-btn");
      btn.type = "button";
      btn.title = "复制";
      btn.innerHTML = COPY_ICON;
      actions.appendChild(btn);

      box.appendChild(code);
      box.appendChild(actions);
      wrap.appendChild(box);

      var feedback = el("div", "copy-feedback");
      wrap.appendChild(feedback);

      bindCopy(btn, feedback, function () {
        return oneLine;
      });

      list.appendChild(wrap);
    });
  }

  // 渲染长文本
  function renderTexts(texts) {
    var list = document.getElementById("texts-list");
    list.innerHTML = "";
    setCount("texts-count", texts.length);
    if (!texts.length) {
      setStatus("texts-status", "texts/ 目录为空，暂无长文本。", false);
      return;
    }
    setStatus("texts-status", "", false);
    texts.forEach(function (item) {
      var wrap = el("div", "item");

      var head = el("div", "item-head");
      var title = el("div", "item-title");
      title.textContent = item.title;
      var del = el("button", "copy-btn item-del");
      del.type = "button";
      del.title = "删除";
      del.setAttribute("aria-label", "删除 " + item.title);
      del.innerHTML = TRASH_ICON;
      del.addEventListener("click", function () {
        requestDelete("text", item.title, item.title);
      });
      head.appendChild(title);
      head.appendChild(del);
      wrap.appendChild(head);

      var box = el("div", "copy-multiline");

      var links = extractHttpLinks(item.text);
      if (links.length) {
        box.classList.add("has-link");
        box.appendChild(makeOpenLink(links[0], "copy-multiline__open"));
      }

      var btn = el("button", "copy-btn copy-multiline__btn");
      btn.type = "button";
      btn.title = "复制";
      btn.innerHTML = COPY_ICON;

      var pre = el("pre", "copy-multiline__text");
      pre.textContent = item.text;

      box.appendChild(btn);
      box.appendChild(pre);
      wrap.appendChild(box);

      var feedback = el("div", "copy-feedback");
      wrap.appendChild(feedback);

      // 长文本复制：保留原始换行。
      bindCopy(btn, feedback, function () {
        return item.text;
      });

      list.appendChild(wrap);
    });
  }

  // 安全渲染：单个区域出错不影响其它区域，并把错误显示在对应区域。
  function safeRender(name, statusId, fn, arg) {
    try {
      fn(arg);
    } catch (e) {
      console.error("渲染 " + name + " 失败：", e);
      setStatus(statusId, "渲染失败：" + (e && e.message ? e.message : e), true);
    }
  }

  function load() {
    fetch("/api/list", { cache: "no-store" })
      .then(function (resp) {
        if (!resp.ok) {
          throw new Error("服务器返回状态 " + resp.status);
        }
        return resp.json();
      })
      .then(function (data) {
        lastList = {
          files: Array.isArray(data.files) ? data.files : [],
          lines: Array.isArray(data.lines) ? data.lines : [],
          texts: Array.isArray(data.texts) ? data.texts : []
        };
        renderAll();
      })
      .catch(function (err) {
        var msg = "加载失败：" + (err && err.message ? err.message : "无法连接到服务器");
        setStatus("files-status", msg, true);
        setStatus("lines-status", msg, true);
        setStatus("texts-status", msg, true);
      });
  }

  function loadVersion() {
    var node = document.getElementById("app-version");
    if (!node) return;
    fetch("/api/version", { cache: "no-store" })
      .then(function (resp) { return resp.ok ? resp.json() : null; })
      .then(function (v) {
        if (!v) return;
        var parts = [];
        if (v.version) parts.push(v.version);
        if (v.buildTime && v.buildTime !== "unknown") parts.push(v.buildTime);
        if (v.commit && v.commit !== "unknown") parts.push(v.commit.slice(0, 7));
        node.textContent = "";
        if (!parts.length) return;
        node.appendChild(document.createTextNode("版本 " + parts.join(" · ")));
        if (v.updateAvailable && v.latestVersion) {
          node.appendChild(document.createTextNode(" · "));
          var a = document.createElement("a");
          a.href = v.releaseURL || "https://github.com/zhongwcool/AceShare/releases";
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "update-hint";
          a.textContent = "有新版本 " + v.latestVersion;
          node.appendChild(a);
        }
      })
      .catch(function () {});
  }

  // 上传文件：POST /api/upload，字段 file。成功后 SSE 会刷新列表，这里再拉一次。
  function setUploadMsg(message, kind) {
    var node = document.getElementById("upload-msg");
    var status = document.getElementById("upload-status");
    if (!node) return;
    node.textContent = message || "";
    node.className = "upload-msg" + (kind ? " " + kind : "");
    if (status) status.hidden = !message;
  }

  function dragHasFiles(ev) {
    var types = ev.dataTransfer && ev.dataTransfer.types;
    if (!types) return false;
    for (var i = 0; i < types.length; i++) {
      if (types[i] === "Files") return true;
    }
    return false;
  }

  function collectFiles(data) {
    var out = [];
    if (!data) return out;
    var items = data.items;
    if (items && items.length) {
      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        if (item.kind && item.kind !== "file") continue;
        var entry = item.webkitGetAsEntry && item.webkitGetAsEntry();
        if (entry && entry.isDirectory) continue;
        var file = item.getAsFile && item.getAsFile();
        if (file) out.push(file);
      }
      if (out.length) return out;
    }
    if (data.files) {
      for (var j = 0; j < data.files.length; j++) out.push(data.files[j]);
    }
    return out;
  }

  function bindUpload() {
    var form = document.getElementById("upload-form");
    var input = document.getElementById("upload-input");
    var drop = document.getElementById("upload-drop");
    var card = form;
    var progress = document.getElementById("upload-progress");
    var bar = document.getElementById("upload-progress-bar");
    if (!form || !input || !drop || !card) return;

    var busy = false;
    var dragDepth = 0;

    function setBusy(on) {
      busy = on;
      input.disabled = on;
      form.classList.toggle("is-busy", on);
      if (!on && progress && bar) {
        progress.hidden = true;
        bar.style.width = "0%";
      }
    }

    function uploadFiles(list) {
      var files = [];
      for (var i = 0; i < list.length; i++) {
        if (list[i]) files.push(list[i]);
      }
      if (!files.length) return;
      if (busy) {
        setUploadMsg("正在上传，请稍候", "");
        return;
      }
      var fd = new FormData();
      for (var n = 0; n < files.length; n++) {
        fd.append("file", files[n], files[n].name);
      }
      setBusy(true);
      if (progress && bar) {
        progress.hidden = false;
        bar.style.width = "0%";
      }
      setUploadMsg(files.length > 1 ? "正在上传 " + files.length + " 个文件…" : "正在上传…", "");

      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/upload");
      xhr.upload.onprogress = function (ev) {
        if (!ev.lengthComputable || !bar || !progress) return;
        var pct = Math.max(0, Math.min(100, Math.round(ev.loaded / ev.total * 100)));
        progress.hidden = false;
        bar.style.width = pct + "%";
        setUploadMsg((files.length > 1 ? "正在上传 " + files.length + " 个文件… " : "正在上传… ") + pct + "%", "");
      };
      xhr.onload = function () {
        var text = String(xhr.responseText || "").trim();
        if (xhr.status >= 200 && xhr.status < 300) {
          var data = {};
          try { data = JSON.parse(text); } catch (e) { data = {}; }
          var names = [];
          var saved = data.files || [];
          for (var i = 0; i < saved.length; i++) {
            if (saved[i] && saved[i].name) names.push(saved[i].name);
          }
          var msg = names.length ? "已上传：" + names.join("、") : "上传完成";
          setUploadMsg(msg, "ok");
          scheduleReload();
        } else {
          if (text.length > 200) text = text.slice(0, 200);
          setUploadMsg("上传失败：" + (text || ("服务器返回 " + xhr.status)), "err");
        }
        setBusy(false);
      };
      xhr.onerror = function () {
        setUploadMsg("上传失败：无法连接到服务器", "err");
        setBusy(false);
      };
      xhr.send(fd);
    }

    form.addEventListener("submit", function (ev) { ev.preventDefault(); });
    input.addEventListener("change", function () {
      if (input.files && input.files.length) uploadFiles(input.files);
      input.value = "";
    });

    card.addEventListener("dragenter", function (ev) {
      if (!dragHasFiles(ev)) return;
      ev.preventDefault();
      dragDepth++;
      form.classList.add("is-over");
    });
    card.addEventListener("dragover", function (ev) {
      if (!dragHasFiles(ev)) return;
      ev.preventDefault();
      if (ev.dataTransfer) ev.dataTransfer.dropEffect = "copy";
    });
    card.addEventListener("dragleave", function (ev) {
      if (!dragHasFiles(ev)) return;
      dragDepth--;
      if (dragDepth <= 0) {
        dragDepth = 0;
        form.classList.remove("is-over");
      }
    });
    card.addEventListener("drop", function (ev) {
      if (!dragHasFiles(ev)) return;
      ev.preventDefault();
      ev.stopPropagation();
      dragDepth = 0;
      form.classList.remove("is-over");
      var files = collectFiles(ev.dataTransfer);
      if (files.length) uploadFiles(files);
    });
    document.addEventListener("dragover", function (ev) {
      if (dragHasFiles(ev)) ev.preventDefault();
    });
    document.addEventListener("drop", function (ev) {
      if (dragHasFiles(ev)) ev.preventDefault();
    });
    document.addEventListener("dragend", function () {
      dragDepth = 0;
      form.classList.remove("is-over");
    });
    document.addEventListener("paste", function (ev) {
      var target = ev.target;
      if (target && (target.tagName === "TEXTAREA" || target.tagName === "INPUT")) return;
      var files = collectFiles(ev.clipboardData);
      if (!files.length) return;
      ev.preventDefault();
      uploadFiles(files);
    });
  }

  // 粘贴录入：提交到 /api/paste，成功后 SSE 会自动刷新列表。
  function setPasteMsg(message, kind, linkHref, linkLabel) {
    var node = document.getElementById("paste-msg");
    if (!node) return;
    node.textContent = "";
    node.className = "paste-msg" + (kind ? " " + kind : "");
    if (!message) return;
    node.appendChild(document.createTextNode(message));
    if (linkHref) {
      node.appendChild(document.createTextNode(" "));
      var a = document.createElement("a");
      a.href = linkHref;
      a.textContent = linkLabel || linkHref;
      node.appendChild(a);
    }
  }

  function bindPasteForm() {
    var form = document.getElementById("paste-form");
    var textEl = document.getElementById("paste-text");
    var titleEl = document.getElementById("paste-title");
    var titleRow = document.getElementById("paste-title-row");
    var submitBtn = document.getElementById("paste-submit");
    var addTitleBtn = document.getElementById("paste-add-title");
    if (!form || !textEl) return;

    var client = detectClient();
    var unavailableHintShown = false;
    var fillSeq = 0;
    textEl.placeholder = defaultPastePlaceholder(client);

    // 点击空输入框：当场 request+read（系统弹窗像 iOS「允许粘贴」）。
    // 已有内容时不覆盖；权限失败可再点一次重试。
    textEl.addEventListener("click", function () {
      if (String(textEl.value || "")) return;
      var seq = ++fillSeq;
      if (!canReadClipboardApi()) {
        if (!unavailableHintShown) {
          unavailableHintShown = true;
          setPasteMsg(clipboardFallbackMsg(null, client, ""), "", clipboardFallbackLink(null, client));
        }
        return;
      }
      setPasteMsg(clipboardPermissionHint(client), "");
      requestClipboardAndRead()
        .then(function (text) {
          if (seq !== fillSeq) return;
          if (String(textEl.value || "")) return;
          if (!String(text || "").trim()) {
            setPasteMsg("剪贴板里没有文本，可直接输入", "");
            return;
          }
          textEl.value = text;
          textEl.focus();
          setPasteMsg("已从剪贴板填入，确认后点保存", "ok");
        })
        .catch(function (err) {
          if (seq !== fillSeq) return;
          queryClipboardPermission().then(function (state) {
            if (seq !== fillSeq) return;
            setPasteMsg(clipboardFallbackMsg(err, client, state), "", clipboardFallbackLink(err, client));
          });
        });
    });

    addTitleBtn.addEventListener("click", function () {
      titleRow.classList.add("is-open");
      addTitleBtn.hidden = true;
      titleEl.focus();
    });

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var text = textEl.value;
      if (!String(text).trim()) {
        setPasteMsg("请先粘贴或输入内容", "err");
        textEl.focus();
        return;
      }
      submitBtn.disabled = true;
      setPasteMsg("正在保存…", "");
      var title = titleRow.classList.contains("is-open") ? (titleEl.value || "") : "";
      fetch("/api/paste", {
        method: "POST",
        headers: { "Content-Type": "application/json; charset=utf-8" },
        body: JSON.stringify({
          title: title,
          text: text,
          kind: "auto"
        })
      })
        .then(function (resp) {
          return resp.text().then(function (body) {
            if (!resp.ok) {
              throw new Error(body || ("服务器返回 " + resp.status));
            }
            try {
              return JSON.parse(body);
            } catch (e) {
              return {};
            }
          });
        })
        .then(function (data) {
          var kindLabel = data.kind === "line" ? "单行文本" : "长文本";
          var savedTitle = data.title || "";
          setPasteMsg("已保存为" + kindLabel + (savedTitle ? "「" + savedTitle + "」" : ""), "ok");
          textEl.value = "";
          titleEl.value = "";
          titleRow.classList.remove("is-open");
          addTitleBtn.hidden = false;
          // SSE 通常会自动刷新；此处再拉一次，确保即时看到结果。
          scheduleReload();
        })
        .catch(function (err) {
          setPasteMsg("保存失败：" + (err && err.message ? err.message : err), "err");
        })
        .then(function () {
          submitBtn.disabled = false;
        });
    });
  }

  // 自动刷新：优先用 SSE 实时接收变化通知；SSE 不可用或断线时回退为定时轮询。
  var reloadTimer = null;
  function scheduleReload() {
    if (reloadTimer) clearTimeout(reloadTimer);
    reloadTimer = setTimeout(load, 150);
  }

  var pollTimer = null;
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(load, 5000);
  }
  function stopPolling() {
    if (pollTimer) {
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function startAutoRefresh() {
    if (typeof EventSource === "undefined") {
      startPolling(); // 浏览器不支持 SSE，直接轮询
      return;
    }
    var es;
    try {
      es = new EventSource("/api/events");
    } catch (e) {
      startPolling();
      return;
    }
    es.addEventListener("change", function (ev) {
      // init 事件是连接建立时的初始同步，无需重复加载首屏。
      if (ev.data === "init") return;
      scheduleReload();
    });
    es.onopen = function () {
      stopPolling(); // SSE 正常，停止兜底轮询
    };
    es.onerror = function () {
      // 连接出错时启用轮询兜底；浏览器会自动尝试重连 SSE。
      startPolling();
    };
  }

  function init() {
    load();
    loadVersion();
    bindUpload();
    bindPasteForm();
    bindPreview();
    bindUndoToast();
    startAutoRefresh();
  }

  // 脚本位于 body 末尾，DOMContentLoaded 可能已触发，需兼容两种情况。
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
